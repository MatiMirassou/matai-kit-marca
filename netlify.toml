[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Known EN/ES showcase, project and presentation routes are pre-rendered into
# dist/<route>/index.html. No blanket SPA rewrite is needed for those pages.
# Selected web media is included as-is in public/media and served by Netlify.
# Original production files and unused media remain excluded from Git.
